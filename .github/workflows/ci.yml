name: CI

# CI gate for bcc-search (introduced by the 2026-07-06 audit: every merge
# here used to be fully ungated — no syntax check, no PHPStan, nothing).
# Now: syntax + PHPStan L8 + PHPUnit unit tests (mirrors bcc-trust's ci.yml).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP — syntax · PHPStan L8 · PHPUnit
    runs-on: ubuntu-latest
    # Checked out INTO the WordPress plugins layout so phpstan.neon's
    # scanDirectories (../bcc-core/src) resolves.
    defaults:
      run:
        working-directory: app/public/wp-content/plugins/bcc-search
    steps:
      - uses: actions/checkout@v4
        with:
          path: app/public/wp-content/plugins/bcc-search

      # phpstan.neon scans ../bcc-core/src for cross-plugin type resolution
      # (ServiceLocator, Logger). Check out the sibling into the WP layout.
      - uses: actions/checkout@v4
        with:
          repository: simontx1983/bcc-core
          path: app/public/wp-content/plugins/bcc-core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        run: |
          set -e
          find app -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          php -l bcc-search.php > /dev/null
          php -l uninstall.php > /dev/null
          echo "All PHP files parse cleanly."

      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Unit tests
        run: composer test

  # The deploy workflow's production health probe targets the WORDPRESS host,
  # which is moving off the apex to cms.bluecollarcrypto.io. bcc-core and
  # bcc-trust were switched to the PROD_HEALTH_BASE repository variable on
  # 2026-08-19 and bcc-search was missed — drift that no PHP test can see, and
  # that would surface after the DNS cutover as a 404 on every production
  # deploy, i.e. disguised as a dead plugin. Pinned here so it cannot recur.
  workflow-guard:
    name: Deploy health-base guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install --quiet --disable-pip-version-check pyyaml

      # --self-test first: it asserts the checker still FAILS on seven
      # mutations of deploy.yml (apex restored, variable removed, staging
      # changed, pre-deploy guard removed or defanged, broken shell, broken
      # YAML). A checker that matches nothing passes just as loudly as one
      # that works, so the mutations are what make the green meaningful.
      - name: Guard self-test (must-flag / must-not-flag)
        run: python .github/scripts/check-deploy-health-base.py --self-test

      - name: Deploy health-base guard
        run: python .github/scripts/check-deploy-health-base.py
